<div class="row">
  <div class="col-12 col-md-6">
    <h2>Admin Login</h2>
    <form (ngSubmit)="onLoginSubmit()">
      <div *ngIf="formError" class="alert alert-danger" role="alert">{{ formError }}</div>
      <div class="form-group mb-3">
        <label for="email">Email Address</label>
        <input class="form-control" type="email" id="email" name="email" [(ngModel)]="credentials.email" required>
      </div>
      <div class="form-group mb-3">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" [(ngModel)]="credentials.password" required>
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="submitting">Sign In</button>
    </form>
  </div>
</div>
