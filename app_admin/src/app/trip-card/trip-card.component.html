
<div class="card h-100">
  <div class="card-header">{{ trip.name }}</div>

  <img [src]="'assets/images/' + trip.image"
       alt="trip thumbnail"
       class="card-img-top">

  <div class="card-body">
    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only
      {{ trip.perPerson | currency:'USD':'symbol' }} per person
    </p>

    <p class="card-text">{{ trip.description }}</p>

    <a *ngIf="isLoggedIn()" [routerLink]="['/edit-trip', trip.code]"
       class="btn btn-primary">
      Edit Trip
    </a>
  </div>
</div>
